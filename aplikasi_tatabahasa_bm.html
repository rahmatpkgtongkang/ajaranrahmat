<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mari Belajar Tatabahasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4; /* Latar belakang hijau lembut (sesuai untuk pembelajaran) */
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-in {
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .btn-hover {
            transition: all 0.2s;
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-emerald-600 text-white p-4 shadow-md z-10">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-extrabold flex items-center gap-2 cursor-pointer" onclick="showHome()">
                <i class="fas fa-book-reader text-yellow-300"></i>
                Jom Belajar Tatabahasa!
            </h1>
            <nav class="hidden md:flex gap-4">
                <button onclick="showHome()" class="px-3 py-1 rounded hover:bg-emerald-700 transition font-semibold"><i class="fas fa-home mr-1"></i> Utama</button>
                <button onclick="showTopikList()" class="px-3 py-1 rounded hover:bg-emerald-700 transition font-semibold"><i class="fas fa-list-ul mr-1"></i> Topik</button>
                <button onclick="showKuizMenu()" class="px-3 py-1 rounded hover:bg-emerald-700 transition font-semibold text-yellow-300"><i class="fas fa-star mr-1"></i> Uji Minda</button>
            </nav>
            <button class="md:hidden text-2xl" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <!-- Menu Mudah Alih Dropdown -->
        <div id="mobileMenu" class="hidden md:hidden bg-emerald-700 absolute top-[68px] left-0 right-0 p-4 shadow-lg flex-col gap-3">
            <button onclick="showHome(); toggleMobileMenu()" class="text-left py-2 font-semibold"><i class="fas fa-home mr-2 w-5 text-center"></i> Utama</button>
            <button onclick="showTopikList(); toggleMobileMenu()" class="text-left py-2 font-semibold"><i class="fas fa-list-ul mr-2 w-5 text-center"></i> Topik Nota</button>
            <button onclick="showKuizMenu(); toggleMobileMenu()" class="text-left py-2 font-semibold text-yellow-300"><i class="fas fa-star mr-2 w-5 text-center"></i> Uji Minda (Kuiz)</button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto relative p-4 md:p-6 lg:p-8" id="mainContent">
        <!-- Kandungan akan dimasukkan di sini melalui JavaScript -->
    </main>

    <script>
        // Data Kandungan Aplikasi
        const dataTatabahasa = {
            kataNama: {
                id: 'kataNama',
                tajuk: 'Kata Nama',
                ikon: 'fa-user-tag',
                warna: 'bg-blue-100 border-blue-400 text-blue-800',
                nota: `
                    <h3 class="text-xl font-bold mb-3 text-blue-700">Pengenalan</h3>
                    <p class="mb-4 text-gray-700">Kata nama ialah perkataan yang digunakan untuk menamakan <strong>orang, haiwan, tempat, dan benda</strong> (sama ada bernyawa atau tidak bernyawa, abstrak atau konkrit).</p>
                    
                    <h3 class="text-xl font-bold mb-3 mt-6 text-blue-700">Jenis Kata Nama</h3>
                    
                    <div class="bg-white p-4 rounded-lg shadow-sm mb-4 border-l-4 border-blue-500">
                        <h4 class="font-bold text-lg text-blue-800 mb-2">1. Kata Nama Am</h4>
                        <p class="text-gray-700 mb-2">Merujuk kepada orang, haiwan, tempat, atau benda secara <strong>umum</strong>. Huruf awalnya ditulis dengan <strong>huruf kecil</strong> (kecuali di awal ayat).</p>
                        <div class="grid grid-cols-2 gap-2 mt-2">
                            <div class="bg-blue-50 p-2 rounded"><span class="font-semibold">Orang:</span> guru, doktor, murid</div>
                            <div class="bg-blue-50 p-2 rounded"><span class="font-semibold">Haiwan:</span> kucing, burung, gajah</div>
                            <div class="bg-blue-50 p-2 rounded"><span class="font-semibold">Tempat:</span> sekolah, klinik, pasar</div>
                            <div class="bg-blue-50 p-2 rounded"><span class="font-semibold">Benda:</span> buku, kerusi, kereta</div>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-lg shadow-sm mb-4 border-l-4 border-purple-500">
                        <h4 class="font-bold text-lg text-purple-800 mb-2">2. Kata Nama Khas</h4>
                        <p class="text-gray-700 mb-2">Merujuk kepada orang, haiwan, tempat, atau benda secara <strong>khusus</strong>. Huruf awalnya <strong>mesti ditulis dengan huruf besar</strong>.</p>
                        <div class="grid grid-cols-2 gap-2 mt-2">
                            <div class="bg-purple-50 p-2 rounded"><span class="font-semibold">Orang:</span> Ahmad, Cikgu Siti</div>
                            <div class="bg-purple-50 p-2 rounded"><span class="font-semibold">Haiwan:</span> Si Tompok, Sang Kancil</div>
                            <div class="bg-purple-50 p-2 rounded"><span class="font-semibold">Tempat:</span> Kuala Lumpur, SK Melati</div>
                            <div class="bg-purple-50 p-2 rounded"><span class="font-semibold">Benda:</span> Proton Saga, Casio</div>
                        </div>
                    </div>
                `,
                kuiz: [
                    { soalan: "Antara berikut, yang manakah Kata Nama Am?", pilihan: ["Proton Saga", "kereta", "Si Comel", "Kuala Lumpur"], jawapan: 1 },
                    { soalan: "Pilih perkataan yang mesti ditulis dengan huruf besar pada awalannya.", pilihan: ["sekolah", "kucing", "Ahmad", "buku"], jawapan: 2 },
                    { soalan: "________ sedang mengajar murid-murid di dalam kelas. (Kata Nama Am)", pilihan: ["Cikgu Aminah", "Guru", "Kucing", "Meja"], jawapan: 1 }
                ]
            },
            kataKerja: {
                id: 'kataKerja',
                tajuk: 'Kata Kerja',
                ikon: 'fa-running',
                warna: 'bg-green-100 border-green-400 text-green-800',
                nota: `
                    <h3 class="text-xl font-bold mb-3 text-green-700">Pengenalan</h3>
                    <p class="mb-4 text-gray-700">Kata kerja ialah perkataan yang menunjukkan <strong>perbuatan atau keadaan</strong> melakukan sesuatu.</p>
                    
                    <h3 class="text-xl font-bold mb-3 mt-6 text-green-700">Jenis Kata Kerja</h3>
                    
                    <div class="bg-white p-4 rounded-lg shadow-sm mb-4 border-l-4 border-green-500">
                        <h4 class="font-bold text-lg text-green-800 mb-2">1. Kata Kerja Transitif (KKT)</h4>
                        <p class="text-gray-700 mb-2">Mesti diikuti oleh <strong>objek</strong> (penyambut) untuk menyempurnakan maksud ayat.</p>
                        <ul class="list-disc ml-5 text-gray-700 mt-2 space-y-1">
                            <li>Ali <strong>menendang</strong> <span class="text-blue-600 font-semibold">bola</span>. ('bola' adalah objek)</li>
                            <li>Ibu <strong>memasak</strong> <span class="text-blue-600 font-semibold">nasi</span>. ('nasi' adalah objek)</li>
                        </ul>
                    </div>

                    <div class="bg-white p-4 rounded-lg shadow-sm mb-4 border-l-4 border-teal-500">
                        <h4 class="font-bold text-lg text-teal-800 mb-2">2. Kata Kerja Tak Transitif (KKTT)</h4>
                        <p class="text-gray-700 mb-2">Sempurna maknanya <strong>tanpa memerlukan objek</strong> selepasnya.</p>
                        <ul class="list-disc ml-5 text-gray-700 mt-2 space-y-1">
                            <li>Adik sedang <strong>tidur</strong>.</li>
                            <li>Burung itu <strong>terbang</strong> tinggi.</li>
                        </ul>
                    </div>
                `,
                kuiz: [
                    { soalan: "Yang manakah menunjukkan satu perbuatan?", pilihan: ["Cantik", "Besar", "Berlari", "Kucing"], jawapan: 2 },
                    { soalan: "Ibu _________ pakaian di ampaian.", pilihan: ["menggoreng", "menjemur", "menulis", "membaca"], jawapan: 1 },
                    { soalan: "Pilih ayat yang menggunakan Kata Kerja Tak Transitif.", pilihan: ["Abu membaca buku.", "Siti melukis gambar.", "Adik sedang menangis.", "Bapa membasuh kereta."], jawapan: 2 }
                ]
            },
            kataAdjektif: {
                id: 'kataAdjektif',
                tajuk: 'Kata Adjektif',
                ikon: 'fa-palette',
                warna: 'bg-yellow-100 border-yellow-400 text-yellow-800',
                nota: `
                    <h3 class="text-xl font-bold mb-3 text-yellow-700">Pengenalan</h3>
                    <p class="mb-4 text-gray-700">Kata adjektif juga dikenali sebagai kata sifat. Ia menerangkan <strong>sifat atau keadaan</strong> sesuatu kata nama.</p>
                    
                    <h3 class="text-xl font-bold mb-3 mt-6 text-yellow-700">Contoh Kategori Kata Adjektif</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-yellow-400">
                            <h4 class="font-bold text-yellow-800">Sifat / Keadaan</h4>
                            <p class="text-sm text-gray-600 mt-1">baik, cerdik, berani, lemah</p>
                        </div>
                        <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-red-400">
                            <h4 class="font-bold text-red-800">Warna</h4>
                            <p class="text-sm text-gray-600 mt-1">merah, biru, hijau, putih</p>
                        </div>
                        <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-blue-400">
                            <h4 class="font-bold text-blue-800">Ukuran</h4>
                            <p class="text-sm text-gray-600 mt-1">panjang, pendek, tebal, nipis</p>
                        </div>
                        <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-purple-400">
                            <h4 class="font-bold text-purple-800">Bentuk</h4>
                            <p class="text-sm text-gray-600 mt-1">bulat, bujur, leper, lurus</p>
                        </div>
                    </div>
                `,
                kuiz: [
                    { soalan: "Kata Adjektif digunakan untuk menerangkan _________.", pilihan: ["perbuatan", "sifat atau keadaan", "nama orang", "masa"], jawapan: 1 },
                    { soalan: "Baju yang dipakai oleh peragawati itu sangat _________.", pilihan: ["laju", "cantik", "berlari", "kucing"], jawapan: 1 },
                    { soalan: "Pilih kata adjektif pancaindera (rasa).", pilihan: ["Manis", "Merah", "Bujur", "Panjang"], jawapan: 0 }
                ]
            }
        };

        const mainContent = document.getElementById('mainContent');

        function showHome() {
            mainContent.innerHTML = `
                <div class="fade-in max-w-4xl mx-auto text-center mt-10 md:mt-20">
                    <img src="https://placehold.co/200x200/059669/ffffff?text=BM&font=Montserrat" alt="Logo BM" class="mx-auto rounded-full shadow-lg mb-6 w-32 h-32 object-cover border-4 border-white">
                    <h2 class="text-4xl md:text-5xl font-extrabold text-emerald-800 mb-4 drop-shadow-sm">Selamat Datang ke Kelas Tatabahasa!</h2>
                    <p class="text-lg md:text-xl text-emerald-700 mb-10 max-w-2xl mx-auto">Mari belajar dan kuasai asas Bahasa Melayu dengan cara yang menyeronokkan dan mudah difahami.</p>
                    
                    <div class="flex flex-col sm:flex-row justify-center gap-4">
                        <button onclick="showTopikList()" class="btn-hover bg-emerald-600 text-white text-xl px-8 py-4 rounded-full font-bold shadow-lg flex items-center justify-center gap-2">
                            <i class="fas fa-book-open"></i> Mula Belajar Nota
                        </button>
                        <button onclick="showKuizMenu()" class="btn-hover bg-yellow-400 text-yellow-900 text-xl px-8 py-4 rounded-full font-bold shadow-lg flex items-center justify-center gap-2">
                            <i class="fas fa-gamepad"></i> Uji Kefahaman Saya
                        </button>
                    </div>
                </div>
            `;
            closeMobileMenu();
        }

        function showTopikList() {
            let html = `
                <div class="fade-in max-w-5xl mx-auto">
                    <h2 class="text-3xl font-bold text-emerald-800 mb-6 border-b-2 border-emerald-200 pb-2"><i class="fas fa-list-ul mr-2 text-emerald-600"></i> Pilih Topik Tatabahasa</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            `;

            for (const key in dataTatabahasa) {
                const topik = dataTatabahasa[key];
                html += `
                    <div onclick="showNota('${key}')" class="btn-hover cursor-pointer bg-white rounded-xl p-6 shadow-md border-t-4 border-emerald-500 flex flex-col items-center text-center group">
                        <div class="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 text-3xl mb-4 group-hover:bg-emerald-500 group-hover:text-white transition-colors">
                            <i class="fas ${topik.ikon}"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 mb-2">${topik.tajuk}</h3>
                        <p class="text-slate-500 text-sm">Klik untuk baca nota dan penerangan lengkap.</p>
                    </div>
                `;
            }

            html += `
                    </div>
                </div>
            `;
            mainContent.innerHTML = html;
            closeMobileMenu();
        }

        function showNota(topikKey) {
            const topik = dataTatabahasa[topikKey];
            mainContent.innerHTML = `
                <div class="slide-in max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
                    <!-- Header Nota -->
                    <div class="bg-gradient-to-r from-emerald-600 to-teal-500 p-6 md:p-8 text-white relative">
                        <button onclick="showTopikList()" class="absolute top-4 left-4 bg-white/20 hover:bg-white/40 p-2 rounded-lg transition backdrop-blur-sm text-sm font-semibold flex items-center gap-1">
                            <i class="fas fa-arrow-left"></i> Kembali
                        </button>
                        <div class="text-center mt-6">
                            <i class="fas ${topik.ikon} text-5xl mb-3 opacity-90"></i>
                            <h2 class="text-3xl md:text-4xl font-extrabold">${topik.tajuk}</h2>
                        </div>
                    </div>
                    
                    <!-- Kandungan Nota -->
                    <div class="p-6 md:p-8 text-lg leading-relaxed">
                        ${topik.nota}
                        
                        <div class="mt-10 pt-6 border-t border-gray-200 flex justify-center">
                            <button onclick="mulaKuiz('${topikKey}')" class="btn-hover bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-3 px-8 rounded-full shadow flex items-center gap-2 text-lg">
                                <i class="fas fa-pencil-alt"></i> Jawab Kuiz Topik Ini
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        let kuizSemasa = [];
        let indeksSoalan = 0;
        let markah = 0;
        let topikKuizSemasa = '';

        function showKuizMenu() {
            let html = `
                <div class="fade-in max-w-4xl mx-auto text-center">
                    <h2 class="text-3xl font-bold text-emerald-800 mb-4"><i class="fas fa-star text-yellow-400 mr-2"></i> Uji Minda Anda!</h2>
                    <p class="text-lg text-emerald-700 mb-8">Pilih topik yang anda ingin uji. Jawab soalan dengan betul untuk kumpul markah.</p>
                    
                    <div class="flex flex-col gap-4 max-w-md mx-auto">
            `;

            for (const key in dataTatabahasa) {
                const topik = dataTatabahasa[key];
                html += `
                    <button onclick="mulaKuiz('${key}')" class="btn-hover bg-white border-2 border-emerald-500 text-emerald-700 font-bold py-4 px-6 rounded-xl shadow-sm text-xl flex items-center justify-between hover:bg-emerald-50">
                        <span class="flex items-center gap-3"><i class="fas ${topik.ikon} text-emerald-500 w-6"></i> Kuiz ${topik.tajuk}</span>
                        <i class="fas fa-chevron-right text-emerald-300"></i>
                    </button>
                `;
            }

            html += `
                    </div>
                </div>
            `;
            mainContent.innerHTML = html;
            closeMobileMenu();
        }

        function mulaKuiz(topikKey) {
            topikKuizSemasa = topikKey;
            kuizSemasa = [...dataTatabahasa[topikKey].kuiz]; // Salin array
            // Shuffle soalan jika mahu, di sini kita kekalkan susunan asal
            indeksSoalan = 0;
            markah = 0;
            paparSoalan();
        }

        function paparSoalan() {
            if (indeksSoalan >= kuizSemasa.length) {
                tamatKuiz();
                return;
            }

            const soalanData = kuizSemasa[indeksSoalan];
            const topik = dataTatabahasa[topikKuizSemasa];
            const peratusan = ((indeksSoalan) / kuizSemasa.length) * 100;

            let html = `
                <div class="slide-in max-w-2xl mx-auto">
                    <!-- Progress Bar -->
                    <div class="mb-6">
                        <div class="flex justify-between text-sm font-semibold text-emerald-700 mb-1">
                            <span>Soalan ${indeksSoalan + 1} / ${kuizSemasa.length}</span>
                            <span>Markah: ${markah}</span>
                        </div>
                        <div class="w-full bg-emerald-200 rounded-full h-2.5">
                            <div class="bg-emerald-600 h-2.5 rounded-full transition-all duration-500" style="width: ${peratusan}%"></div>
                        </div>
                    </div>

                    <!-- Kad Soalan -->
                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border-2 border-emerald-100">
                        <div class="bg-emerald-50 p-6 border-b border-emerald-100">
                            <h3 class="text-xl font-bold text-emerald-900">${soalanData.soalan}</h3>
                        </div>
                        <div class="p-6 space-y-3" id="pilihanJawapan">
            `;

            soalanData.pilihan.forEach((pilihanText, index) => {
                html += `
                    <button onclick="semakJawapan(${index}, this)" class="w-full text-left p-4 rounded-xl border-2 border-gray-200 hover:border-emerald-500 hover:bg-emerald-50 transition font-medium text-gray-700 text-lg group">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center font-bold group-hover:bg-emerald-200 group-hover:text-emerald-700 transition">
                                ${String.fromCharCode(65 + index)}
                            </div>
                            ${pilihanText}
                        </div>
                    </button>
                `;
            });

            html += `
                        </div>
                    </div>
                </div>
            `;
            mainContent.innerHTML = html;
        }

        function semakJawapan(indeksPilihan, butangElemen) {
            // Halang klik banyak kali
            const semuaButang = document.querySelectorAll('#pilihanJawapan button');
            semuaButang.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('hover:border-emerald-500', 'hover:bg-emerald-50', 'cursor-pointer');
            });

            const soalanData = kuizSemasa[indeksSoalan];
            const jawapanBetul = soalanData.jawapan;

            if (indeksPilihan === jawapanBetul) {
                // Jawapan Betul
                markah += 10;
                butangElemen.classList.replace('border-gray-200', 'border-green-500');
                butangElemen.classList.add('bg-green-100');
                butangElemen.innerHTML += `<i class="fas fa-check-circle text-green-500 text-2xl absolute right-8"></i>`;
                playBunyiBetul();
            } else {
                // Jawapan Salah
                butangElemen.classList.replace('border-gray-200', 'border-red-500');
                butangElemen.classList.add('bg-red-50');
                butangElemen.innerHTML += `<i class="fas fa-times-circle text-red-500 text-2xl absolute right-8"></i>`;
                
                // Tunjuk jawapan betul
                const butangBetul = semuaButang[jawapanBetul];
                butangBetul.classList.replace('border-gray-200', 'border-green-500');
                butangBetul.classList.add('bg-green-50');
                playBunyiSalah();
            }

            // Ke soalan seterusnya selepas delay
            setTimeout(() => {
                indeksSoalan++;
                paparSoalan();
            }, 1500);
        }

        function tamatKuiz() {
            const markahPenuh = kuizSemasa.length * 10;
            const peratus = (markah / markahPenuh) * 100;
            let mesej = '';
            let warnaBintang = '';
            let ikonEmoji = '';

            if (peratus === 100) {
                mesej = "Tahniah! Cemerlang!";
                warnaBintang = 'text-yellow-400';
                ikonEmoji = 'fa-medal';
            } else if (peratus >= 60) {
                mesej = "Bagus! Teruskan Usaha.";
                warnaBintang = 'text-emerald-400';
                ikonEmoji = 'fa-thumbs-up';
            } else {
                mesej = "Jangan putus asa, cuba lagi!";
                warnaBintang = 'text-gray-400';
                ikonEmoji = 'fa-book-reader';
            }

            mainContent.innerHTML = `
                <div class="fade-in max-w-lg mx-auto bg-white rounded-3xl shadow-2xl p-8 text-center border-t-8 border-emerald-500 mt-10">
                    <i class="fas ${ikonEmoji} text-6xl ${warnaBintang} mb-4"></i>
                    <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Kuiz Tamat!</h2>
                    <p class="text-xl text-emerald-600 font-semibold mb-6">${mesej}</p>
                    
                    <div class="bg-gray-50 rounded-2xl p-6 mb-8">
                        <p class="text-gray-500 uppercase tracking-wider text-sm font-bold mb-1">Markah Anda</p>
                        <p class="text-5xl font-black text-slate-800">${markah} <span class="text-2xl text-gray-400">/ ${markahPenuh}</span></p>
                    </div>

                    <div class="flex flex-col gap-3">
                        <button onclick="mulaKuiz('${topikKuizSemasa}')" class="btn-hover bg-emerald-600 text-white font-bold py-3 px-6 rounded-full w-full">
                            <i class="fas fa-redo-alt mr-2"></i> Cuba Lagi
                        </button>
                        <button onclick="showTopikList()" class="btn-hover bg-emerald-100 text-emerald-800 font-bold py-3 px-6 rounded-full w-full">
                            <i class="fas fa-book mr-2"></i> Baca Nota Semula
                        </button>
                    </div>
                </div>
            `;
        }

        
        // Logik Menu Mudah Alih
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        mobileMenuBtn.addEventListener('click', toggleMobileMenu);

        function toggleMobileMenu() {
            mobileMenu.classList.toggle('hidden');
            mobileMenu.classList.toggle('flex');
            const icon = mobileMenuBtn.querySelector('i');
            if (mobileMenu.classList.contains('hidden')) {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            } else {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            }
        }

        function closeMobileMenu() {
            mobileMenu.classList.add('hidden');
            mobileMenu.classList.remove('flex');
            const icon = mobileMenuBtn.querySelector('i');
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
        }

        // Sintesis Audio Ringkas menggunakan Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Volume rendah
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function playBunyiBetul() {
            playTone(600, 'sine', 0.1);
            setTimeout(() => playTone(800, 'sine', 0.2), 100);
        }

        function playBunyiSalah() {
            playTone(300, 'square', 0.2);
            setTimeout(() => playTone(250, 'square', 0.3), 150);
        }

        // Inisialisasi Aplikasi
        window.onload = () => {
            showHome();
        };

    </script>
</body>
